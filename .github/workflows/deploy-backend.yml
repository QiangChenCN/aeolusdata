name: Deploy (Backend + Web + Compute)

# 主流部署方式：代码推到 main 后，由 GitHub Actions 负责全量部署
#   · Backend (NestJS 8787)：pnpm install --frozen-lockfile + build → rsync dist/ → restart aeolusdata-backend
#   · Web (前端静态)：pnpm install --frozen-lockfile + build → rsync apps/web/dist/（后端 main.ts 托管，无需重启）
#   · Compute (Python 8900)：rsync 源码（保留服务器本地数据）→ pip 同步依赖 → restart aeolusdata-compute
# 构建产物（dist/）与 .venv 不进 git 仓库，均在各自步骤现场产出 / 复用。
# 依赖管理统一用 pnpm（见仓库根 pnpm-workspace.yaml / pnpm-lock.yaml；packageManager 锁定版本，靠 corepack 启用）。
#
# 需要在仓库 Settings → Secrets and variables → Actions 中配置：
#   ECS_HOST      服务器 IP 或域名
#   ECS_USER      SSH 登录用户（需有 /opt/aeolusdata 写权限与 systemctl 权限）
#   ECS_SSH_KEY   登录用的私钥（对应服务器 ~/.ssh/authorized_keys 里的公钥）

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'services/compute/**'
      - 'deploy/**'
      - '.github/workflows/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'package.json'
      - '.npmrc'
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      # 用根 package.json 的 packageManager 字段锁定 pnpm 版本（corepack 据此启用对应版本）
      - name: Enable Corepack (pnpm)
        run: corepack enable

      # 单一依赖安装入口：pnpm 工作区一次性装齐（api/web/shared），后续构建步骤直接复用
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      # ---------- Backend ----------
      - name: Build & Deploy Backend
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "$ECS_SSH_KEY" | tr -d '\r' | ssh-add -
          pnpm --filter aeolus-workbench-backend build
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            apps/api/dist/ \
            "$ECS_USER@$ECS_HOST:/opt/aeolusdata/apps/api/dist/"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$ECS_USER@$ECS_HOST" 'systemctl restart aeolusdata-backend aeolusdata-worker'

      # ---------- Web（静态由后端托管，仅同步 dist，无需重启）----------
      - name: Build & Deploy Web
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "$ECS_SSH_KEY" | tr -d '\r' | ssh-add -
          pnpm --filter aeolus-workbench-web build
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            apps/web/dist/ \
            "$ECS_USER@$ECS_HOST:/opt/aeolusdata/apps/web/dist/"

      # ---------- Compute (Python) ----------
      # 注意：services/compute/ 内含服务器本地运行时数据（dashboard/standard/*.json、logs/ 等，均 gitignore），
      # 绝不可用 --delete，否则会删除服务器本地配置、搞坏其他看板。
      # 仅同步源码 + 排除 .venv/缓存；依赖用 pip 在服务器 venv 内同步；最后 restart aeolusdata-compute。
      # 本次把 analytics/assessment/timeout.py 迁到 analytics/delivery_timeout/，显式删掉服务器上的旧文件。
      - name: Deploy Compute (Python)
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "$ECS_SSH_KEY" | tr -d '\r' | ssh-add -
          rsync -az \
            --exclude='.venv' --exclude='__pycache__' --exclude='*.pyc' \
            --exclude='*.err' --exclude='*.log' --exclude='logs/' \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            services/compute/ \
            "$ECS_USER@$ECS_HOST:/opt/aeolusdata/services/compute/"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$ECS_USER@$ECS_HOST" \
            'export PATH="$HOME/.local/bin:$PATH"
             cd /opt/aeolusdata
             rm -f /opt/aeolusdata/services/compute/analytics/assessment/timeout.py
             # 按 uv.lock 精确复现依赖（含 OpenTelemetry）；--frozen 与 pyproject.toml 不一致会直接报错。
             (cd services/compute && uv sync --frozen --no-dev)
             # 重启前预检：otel 包在服务器 venv 内可正常导入，避免 OTEL_ENABLED=true 时服务起不来。
             (cd services/compute && OTEL_ENABLED=true uv run python -c "import compute_api.otel" && echo "compute otel import OK")
             systemctl restart aeolusdata-compute'
