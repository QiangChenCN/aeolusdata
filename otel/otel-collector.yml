# OpenTelemetry Collector 配置（contrib 镜像）。
# 只做 traces 转发到 Tempo；metrics 通道预留（以后若要 Prometheus 可在此加 prometheus exporter）。

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        # 前端浏览器跨域上报需要 CORS；生产可收敛为前端域名白名单。
        cors:
          allowed_origins:
            - "*"

processors:
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

extensions:
  health_check: {}

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
