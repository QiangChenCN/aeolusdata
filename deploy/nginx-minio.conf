# MinIO 管理控制台（WebUI，9001）对外入口。
#
# 域名分工（本仓库约定）：
#   minio.qixinchen.top → WebUI 控制台 (9001)：本文件，限来源 IP
#   s3.qixinchen.top    → S3 API (9000)：图片直链，见 nginx-s3.conf
#
# 拓扑：
#   浏览器 ──HTTPS──> nginx(minio.qixinchen.top:443) ──内网──> 127.0.0.1:9001
#
# ⚠️ 控制台权限极大（可读写全部桶/删数据），必须限来源 IP。
#    allow 行写你的常用出口 IP（多行可叠加），deny all 兜底；改完 nginx -t && reload。
#
# 配套环境变量（/etc/default/minio，改后 systemctl restart minio）：
#   MINIO_BROWSER_REDIRECT_URL=https://minio.qixinchen.top
#   （控制台登录跳转用的对外地址，不设则跳 :9001 导致浏览器打不开）
#
# 证书：cert-name = minio.qixinchen.top（含 minio + s3 两个 SAN，--expand 维护）。

server {
    listen 80;
    server_name minio.qixinchen.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name minio.qixinchen.top;

    ssl_certificate     /etc/letsencrypt/live/minio.qixinchen.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.qixinchen.top/privkey.pem;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # 限来源：按需增删 allow 行（家宽 IP 会变，变了改这里）

    # 控制台是 SPA + websocket，缓冲必须关、升级头必须透传
    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
