# MinIO S3 API 对外入口（图片公网直链读取）。
#
# 域名分工（本仓库约定）：
#   s3.qixinchen.top    → S3 API (9000)：图片直链，UI「MinIO 设置 → public_base」用它
#   minio.qixinchen.top → WebUI 控制台 (9001)：见 nginx-minio.conf（限 IP）
#
# 拓扑：
#   浏览器 / 钉钉群 ──HTTPS──> nginx(s3.qixinchen.top:443) ──内网──> 127.0.0.1:9000
#   后端上传 ──内网直连──> 127.0.0.1:9000（endpoint=127.0.0.1, secure=false）
#
# 为什么不把上传也走域名：SigV4 签名含 Host 头，走反代易踩签名/分块坑；同机部署没必要。
# 若 MinIO 在别的机器，把 proxy_pass 换成那台的**内网 IP**。
#
# 证书：cert-name = minio.qixinchen.top（含 minio + s3 两个 SAN，--expand 维护）。

server {
    listen 80;
    server_name s3.qixinchen.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name s3.qixinchen.top;

    ssl_certificate     /etc/letsencrypt/live/minio.qixinchen.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.qixinchen.top/privkey.pem;

    # 默认 1m 对截图/长图偏小；留足余量
    client_max_body_size 50m;

    # 隐藏 MinIO 版本信息
    proxy_hide_header X-Amz-Request-Id;

    location / {
        proxy_pass http://127.0.0.1:9000;
        # 保持 Host 为公网域名（MinIO 生成重定向/预签名 URL 时会用到）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
