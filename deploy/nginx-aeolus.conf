# 反向代理：只对外暴露 443，8917 留在内网由 nginx 反代
# 证书放 /etc/nginx/ssl/aeolus/ （阿里云免费 DV 证 或 certbot 自签）
server {
    listen 443 ssl;
    server_name _;   # 改成你的域名，如 wb.example.com；无域名先用 _ 配合自签证书

    ssl_certificate     /etc/nginx/ssl/aeolus/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/aeolus/privkey.pem;

    # 安全：不对外暴露 8917，隐藏后端信息
    proxy_hide_header X-Powered-By;

    location / {
        proxy_pass http://127.0.0.1:8917;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;        # SSE 日志流必须关缓冲
        proxy_read_timeout 3600s;
    }
}
