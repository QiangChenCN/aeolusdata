# 反向代理：业务只对外暴露 443（80 仅做跳转）。
# 8787 = NestJS 后端（路由 / 鉴权 / 取数编排 / 静态托管）—— 由本文件反代
# 8900 = Python 计算服务 —— 只由后端回访，绝不直接对外（保持 127.0.0.1 监听）
# 证书放 /etc/nginx/ssl/aeolus/ （certbot 软链 / Let's Encrypt 自动续期）
#
# 80：只做 301 跳转，不承载业务（HTTPS 强制；钉钉 OAuth 回调也要求 HTTPS）
# 证书续期走 certbot --standalone + pre/post hook 停启 nginx（见 deploy/DEPLOY.md）
server {
    listen 80;
    server_name aeolusdata.qixinchen.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name aeolusdata.qixinchen.top;   # 本项目域名；迁移过渡期可空格追加旧域名（如 aeolus.qixinchen.top）实现双域名并行

    ssl_certificate     /etc/nginx/ssl/aeolus/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/aeolus/privkey.pem;

    # 压缩：显著降低前端 bundle / API JSON 的传输体积（首屏与刷新更快）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 安全：不对外暴露后端端口，隐藏后端信息
    proxy_hide_header X-Powered-By;

    location / {
        # 旧架构是 8917（单体 server.py，已整体删除）。现统一由 NestJS 后端 8787 承接；
        # 8900 的 Python 计算服务只接受 8787 的环回调用，不对外暴露。
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;        # SSE 日志流必须关缓冲
        proxy_read_timeout 3600s;
    }
}
